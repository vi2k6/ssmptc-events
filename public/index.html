<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmic Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --neon: #6EE7F9; --neon2: #A78BFA; }
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12); }
    .glow { box-shadow: 0 0 30px rgba(110,231,249,0.2), inset 0 0 30px rgba(167,139,250,0.05); }
    .neon-text { text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon2); }
    .btn { transition: transform .15s ease, box-shadow .2s ease; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(110,231,249,.25); }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-black text-slate-100">
  <header class="sticky top-0 z-20 glass glow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="assets/logo.svg" class="w-8 h-8" alt="logo">
        <h1 class="text-xl font-extrabold neon-text">COSMIC Events</h1>
      </div>
      <nav class="flex items-center gap-2">
        <button id="nav-home" class="px-3 py-2 rounded-xl glass">Home</button>
        <button id="nav-myregs" class="px-3 py-2 rounded-xl glass">My Registrations</button>
        <button id="nav-login" class="px-3 py-2 rounded-xl glass">Login/Dashboard</button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <!-- FILTERS -->
    <section id="filters" class="mb-6 glass rounded-2xl p-4 glow">
      <div class="flex flex-col md:flex-row gap-3 items-stretch md:items-end">
        <div class="flex-1">
          <label class="block text-sm mb-1">Search (event/program)</label>
          <input id="search-input" class="w-full glass rounded-xl p-3" placeholder="Search by name...">
        </div>
        <div>
          <label class="block text-sm mb-1">Department</label>
          <select id="filter-dept" class="glass rounded-xl p-3">
            <option value="">All</option>
            <option>CSE</option><option>ECE</option><option>EEE</option><option>IT</option><option>ME</option><option>ALL</option>
          </select>
        </div>
        <div>
          <label class="block text-sm mb-1">Semester</label>
          <select id="filter-sem" class="glass rounded-xl p-3">
            <option value="">All</option>
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
          </select>
        </div>
        <div>
          <label class="block text-sm mb-1">Type</label>
          <select id="filter-type" class="glass rounded-xl p-3">
            <option value="">All</option>
            <option value="upcoming">Upcoming</option>
            <option value="present">Present</option>
            <option value="past">Past</option>
          </select>
        </div>
        <button id="filter-btn" class="btn px-4 py-3 rounded-xl glass glow">Apply</button>
      </div>
    </section>

    <!-- HOME SECTIONS -->
    <section id="home-sections" class="space-y-10"></section>

    <!-- MY REGISTRATIONS -->
    <section id="myregs-section" class="hidden">
      <div class="glass rounded-2xl p-4 glow">
        <h2 class="text-2xl font-bold mb-4">My Registrations</h2>
        <div class="flex gap-3 items-end mb-4">
          <div class="flex-1">
            <label class="block text-sm mb-1">Roll No</label>
            <input id="myregs-roll" class="w-full glass rounded-xl p-3" placeholder="Enter your Roll No">
          </div>
          <button id="myregs-btn" class="btn px-4 py-3 rounded-xl glass glow">Fetch</button>
          <button id="myregs-print" class="btn px-4 py-3 rounded-xl glass glow">Print / Save PDF</button>
        </div>
        <div id="myregs-list" class="grid md:grid-cols-2 gap-4"></div>
      </div>
    </section>

    <!-- LOGIN / DASHBOARD -->
    <section id="login-section" class="hidden">
      <div class="grid md:grid-cols-3 gap-6">
        <div class="md:col-span-1 glass rounded-2xl p-4 glow">
          <h2 class="text-xl font-bold mb-2">Login</h2>
          <label class="block text-sm">Role</label>
          <select id="login-role" class="glass rounded-xl p-2 mb-2">
            <option value="admin">Admin</option>
            <option value="owner">Owner</option>
          </select>
          <label class="block text-sm">ID</label>
          <input id="login-id" class="w-full glass rounded-xl p-2 mb-2">
          <label class="block text-sm">Password</label>
          <input id="login-pw" type="password" class="w-full glass rounded-xl p-2 mb-3">
          <button id="login-btn" class="btn px-4 py-2 rounded-xl glass glow w-full">Login</button>
          <p id="login-msg" class="text-sm mt-2 text-red-300"></p>
        </div>
        <div class="md:col-span-2 glass rounded-2xl p-4 glow">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-xl font-bold">Dashboard</h2>
            <div class="flex gap-2">
              <span id="user-badge" class="text-sm"></span>
              <button id="logout-btn" class="px-3 py-2 rounded-xl glass">Logout</button>
            </div>
          </div>
          <div id="dashboard-content" class="grid gap-4 md:grid-cols-2 hidden">
            <div class="glass rounded-2xl p-4">
              <h3 class="font-semibold mb-2">Events</h3>
              <div class="flex gap-2 mb-2">
                <button id="ev-refresh" class="px-3 py-2 rounded-xl glass">Refresh</button>
                <button id="ev-new" class="px-3 py-2 rounded-xl glass">New Event</button>
              </div>
              <div id="ev-list" class="space-y-2 max-h-80 overflow-auto"></div>
            </div>
            <div class="glass rounded-2xl p-4">
              <h3 class="font-semibold mb-2">Programs (selected event)</h3>
              <div class="flex gap-2 mb-2">
                <button id="prg-refresh" class="px-3 py-2 rounded-xl glass">Refresh</button>
                <button id="prg-new" class="px-3 py-2 rounded-xl glass">New Program</button>
              </div>
              <div id="prg-list" class="space-y-2 max-h-80 overflow-auto"></div>
            </div>
            <div class="glass rounded-2xl p-4 md:col-span-2">
              <h3 class="font-semibold mb-2">Registrations</h3>
              <div class="flex gap-2 mb-2">
                <button id="reg-refresh" class="px-3 py-2 rounded-xl glass">Refresh</button>
              </div>
              <div id="reg-list" class="space-y-2 max-h-80 overflow-auto"></div>
            </div>
            <div id="owner-panel" class="glass rounded-2xl p-4 md:col-span-2 hidden">
              <h3 class="font-semibold mb-2">Owner: Manage Admins</h3>
              <div class="flex gap-2 mb-2">
                <input id="new-admin-id" placeholder="Admin ID" class="glass rounded-xl p-2">
                <input id="new-admin-pw" placeholder="Password" class="glass rounded-xl p-2">
                <button id="admin-create" class="px-3 py-2 rounded-xl glass">Create</button>
              </div>
              <div id="admins-list" class="space-y-2"></div>
            </div>
          </div>
          <div id="login-prompt" class="text-center text-slate-400 py-8">
            Please login to access the dashboard
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Register Modal -->
  <div id="reg-modal" class="fixed inset-0 bg-black/60 backdrop-blur hidden items-center justify-center p-4">
    <div class="glass rounded-2xl p-6 max-w-lg w-full">
      <h3 class="text-xl font-bold mb-3">Register for Program</h3>
      <div class="space-y-2">
        <input id="reg-name" class="w-full glass rounded-xl p-2" placeholder="Name">
        <input id="reg-roll" class="w-full glass rounded-xl p-2" placeholder="Roll No">
        <label class="block text-sm">Semester (1-6)</label>
        <select id="reg-sem" class="w-full glass rounded-xl p-2">
          <option value="">Select</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
        </select>
        <label class="block text-sm">Department</label>
        <input id="reg-dept" class="w-full glass rounded-xl p-2" placeholder="e.g., CSE">
        <p id="reg-msg" class="text-sm text-red-300"></p>
      </div>
      <div class="mt-4 flex justify-end gap-2">
        <button id="reg-cancel" class="px-3 py-2 rounded-xl glass">Cancel</button>
        <button id="reg-submit" class="px-3 py-2 rounded-xl glass glow">Submit</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
