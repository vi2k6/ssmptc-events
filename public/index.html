<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SSMPTC Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
    .hidden { display: none; }
    .section { margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>SSMPTC Events</h1>

  <!-- Login Section -->
  <div id="loginSection" class="section">
    <h2>Login</h2>
    <input id="loginId" placeholder="ID">
    <input id="loginPass" type="password" placeholder="Password">
    <select id="loginRole">
      <option value="admin">Admin</option>
      <option value="owner">Owner</option>
    </select>
    <button onclick="login()">Login</button>
  </div>

  <!-- Logout Button -->
  <div id="logoutSection" class="section hidden">
    <p>Welcome, <span id="userRole"></span> (<span id="userId"></span>)</p>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Public Events Section -->
  <div id="eventsSection" class="section">
    <h2>Events</h2>
    <div id="eventsList"></div>
  </div>

  <!-- Admin Panel -->
  <div id="adminPanel" class="section hidden">
    <h2>Admin Panel</h2>
    <button onclick="loadAdminEvents()">Manage Events</button>
    <button onclick="loadRegistrations()">Manage Registrations</button>
    <div id="adminContent"></div>
  </div>

  <!-- Owner Panel -->
  <div id="ownerPanel" class="section hidden">
    <h2>Owner Panel</h2>
    <button onclick="manageAdmins()">Manage Admins</button>
    <div id="ownerContent"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
